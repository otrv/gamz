[graph]
all-features = true
exclude-dev = false

[bans]
allow-workspace = false
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "game-core", wrappers = ["game"] },
    { crate = "game-memory", wrappers = ["game"] },
    { crate = "renderer", wrappers = ["platform", "platform-web"] },
    { crate = "game", wrappers = ["platform", "platform-web"] },
]
