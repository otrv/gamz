[graph]
all-features = true
exclude-dev = false

[bans]
allow-workspace = false
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "game-core", wrappers = ["game", "benchmark-game"] },
    { crate = "game-memory", wrappers = ["game", "benchmark-game"] },
    { crate = "renderer", wrappers = ["platform", "benchmark-platform"] },
]
