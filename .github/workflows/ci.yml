name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: system
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
          packages=$(dpkg-query -W | sha256sum | cut -d ' ' -f 1)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install
      - uses: actions/cache/restore@v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-shear
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.rustup/toolchains/nightly-2026-10-01-x86_64-unknown-linux-gnu
            ~/.cache/miri
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-v1-${{ steps.system.outputs.packages }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock', '.cargo/**', 'clippy.toml', 'rustfmt.toml', '**/deny.toml', 'scripts/**', '.githooks/**', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-v1-${{ steps.system.outputs.packages }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock', '.cargo/**', 'clippy.toml', 'rustfmt.toml', '**/deny.toml', 'scripts/**', '.githooks/**', '.github/workflows/ci.yml') }}-
      - run: ./scripts/setup
      - run: .githooks/pre-commit --all
      - uses: actions/cache/save@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-shear
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.rustup/toolchains/nightly-2026-10-01-x86_64-unknown-linux-gnu
            ~/.cache/miri
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
