[package]
name = "renderer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
wgpu = ["dep:wgpu", "dep:num-traits"]

[dependencies]
platform-api = { path = "../platform-api" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "metal", "dx12", "webgpu", "wgsl"], optional = true }
num-traits = { version = "0.2", default-features = false, features = ["std"], optional = true }

[lints]
workspace = true
