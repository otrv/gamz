[package]
name = "benchmark-platform"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
autobins = false

[features]
cli = ["dep:rustix", "dep:serde", "dep:serde_json"]
linux = ["dep:alsa", "dep:renderer", "renderer/wgpu", "dep:pollster", "dep:rustix", "dep:winit"]

[[bin]]
name = "benchmark-linux"
path = "../platform/src/linux/main.rs"
required-features = ["linux"]

[[bin]]
name = "benchmark-cli"
path = "../platform/src/cli/main.rs"
required-features = ["cli"]

[dependencies]
game = { package = "benchmark-game", path = "../benchmark-game" }
platform-api = { path = "../platform-api" }
serde = { version = "1.0", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1.0", default-features = false, features = ["std"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.12.1", default-features = false, features = ["std"], optional = true }
renderer = { path = "../renderer", default-features = false, optional = true }
pollster = { version = "0.4.0", default-features = false, optional = true }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"], optional = true }
winit = { version = "0.30.13", default-features = false, features = ["x11", "rwh_06"], optional = true }

[lints]
workspace = true
