[package]
name = "platform-web"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
game = { path = "../game" }
platform-api = { path = "../platform-api" }
renderer = { path = "../renderer" }
wasm-bindgen = { version = "=0.2.129", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "0.4.79", default-features = false, features = ["std"] }
web-sys = { version = "0.3.106", default-features = false, features = ["HtmlCanvasElement"] }
js-sys = { version = "0.3.106", default-features = false, features = ["std"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[lints.rust]
warnings = "deny"
forbidden_lint_groups = "forbid"
rust_2024_compatibility = { level = "forbid", priority = -1 }
non_camel_case_types = "deny"
non_upper_case_globals = "deny"
unused_attributes = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "forbid"
unreachable_pub = "forbid"
linker_messages = "forbid"
ambiguous_associated_items = "forbid"
ambiguous_glob_imports = "forbid"
arithmetic_overflow = "forbid"
binary_asm_labels = "forbid"
bindings_with_variant_name = "forbid"
conflicting_repr_hints = "forbid"
dangerous_implicit_autorefs = "forbid"
deref_nullptr = "forbid"
duplicate_features = "forbid"
enum_intrinsics_non_enums = "forbid"
explicit_builtin_cfgs_in_flags = "forbid"
ill_formed_attribute_input = "forbid"
incomplete_include = "forbid"
ineffective_unstable_trait_impl = "forbid"
invalid_atomic_ordering = "forbid"
invalid_from_utf8_unchecked = "forbid"
invalid_macro_export_arguments = "forbid"
invalid_null_arguments = "forbid"
invalid_reference_casting = "forbid"
invalid_runtime_symbol_definitions = "forbid"
invalid_type_param_default = "forbid"
legacy_derive_helpers = "forbid"
let_underscore_lock = "forbid"
long_running_const_eval = "deny"
macro_expanded_macro_exports_accessed_by_absolute_paths = "forbid"
mutable_transmutes = "forbid"
named_asm_labels = "forbid"
never_type_fallback_flowing_into_unsafe = "forbid"
no_mangle_const_items = "forbid"
out_of_scope_macro_calls = "forbid"
overflowing_literals = "forbid"
patterns_in_fns_without_body = "forbid"
proc_macro_derive_resolution_fallback = "forbid"
pub_use_of_private_extern_crate = "forbid"
semicolon_in_expressions_from_macros = "forbid"
text_direction_codepoint_in_comment = "forbid"
text_direction_codepoint_in_literal = "forbid"
unconditional_panic = "forbid"
undropped_manually_drops = "forbid"
uninhabited_static = "forbid"
unknown_crate_types = "forbid"
useless_deprecated = "forbid"
varargs_without_pattern = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
useless_attribute = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes = "deny"
infinite_loop = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
