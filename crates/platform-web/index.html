<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>gamz</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; height: 100%; background: #101118; color: #eceef5; font: 15px system-ui, sans-serif; }
        main { position: relative; width: 100%; height: 100%; }
        canvas { display: block; width: 100%; height: 100%; outline: none; }
        #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #101118c9; padding: 24px; }
        #overlay[hidden] { display: none; }
        section { max-width: 440px; text-align: center; }
        h1 { font-size: 24px; font-weight: 500; }
        #status { line-height: 1.5; overflow-wrap: anywhere; }
        button { font: inherit; border: 1px solid #bfc8e4; border-radius: 6px; background: #eceef5; color: #151722; padding: 12px 36px; cursor: pointer; }
        button:hover { background: #cbd7ff; }
        button:focus-visible { outline: 3px solid #8daaff; outline-offset: 4px; }
        button:disabled { opacity: 0.5; cursor: wait; }
        small { display: block; margin-top: 24px; color: #b6bac9; line-height: 1.7; }
    </style>
</head>
<body>
    <main>
        <canvas tabindex="0" aria-label="Game canvas"></canvas>
        <div id="overlay">
            <section>
                <h1>gamz</h1>
                <p id="status" role="status">Loading game…</p>
                <button id="play" type="button" disabled>Play</button>
                <small>W A S D · Move &nbsp; Space · Start<br>Arrow keys · Actions &nbsp; Q / E · Shoulders &nbsp; Esc · Back<br>The game pauses when it loses focus.</small>
            </section>
        </div>
    </main>
    <script type="module">
        try {
            const { default: init, start } = await import("./game.js");
            await init();
            start(document.querySelector("canvas"));
        } catch (error) {
            document.querySelector("#status").textContent = String(error);
            document.querySelector("#play").hidden = true;
            console.error(error);
        }
    </script>
</body>
</html>
